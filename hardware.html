<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Release: Edge firmware 2026.12 hardware testing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="morphdom.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:#2457D6}a:hover{color:#1A3FA0}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F9; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="index.html" aria-label="Release Tool home" style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #16181D; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="#2457D6" stroke-width="2"></rect><path d="M8 18l5-8 3 5 4-6" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-weight: 600; font-size: 17px">Release Tool</span>
      </a>
      <span title="Every number on this page is made up for the mockup. Values change on a timer to show how live updates would look." style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: #FFF3E0; color: #8A4B00; font-size: 13px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C26A00"></span>Demo · simulated data</span>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 64px; display: flex; flex-direction: column; gap: 24px">
    <a href="index.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; text-decoration: none; font-weight: 500"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg>All releases</a>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px">
      <div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
          <h1 style="margin: 0; font-size: 28px; font-weight: 600">Edge firmware 2026.12</h1>
          <span style="padding: 4px 12px; border-radius: 999px; background: #FFF3E0; color: #8A4B00; font-weight: 600; font-size: 13px">Watching</span>
        </div>
        <p style="margin: 6px 0 0; color: #5B6270">Hardware test pass across 11 configurations and 7 OS versions. Target Dec 9 · Owner: Edge Hardware team</p>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <a href="#coverage" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid #D5D9E0; border-radius: 8px; background: #FFFFFF; color: #16181D; text-decoration: none">Open test matrix</a>
        <button type="button" disabled title="Not connected yet: this integration is planned but not built in the demo" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px dashed #C4C9D2; border-radius: 8px; background: #F6F7F9; color: #6B7280; font: inherit; cursor: not-allowed">Open in Jira<span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #EEF0F3; color: #5B6270">Not connected</span></button>
      </div>
    </div>

    <section aria-label="Release recommendation" style="background: {{rec.bg}}; border: 1px solid {{rec.border}}; border-left: 6px solid {{rec.ink}}; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{rec.ink}}">Recommendation</span>
        <span style="font-size: 20px; font-weight: 600; color: {{rec.ink}}">{{rec.verdict}}</span>
      </div>
      <div style="font-size: 15px"><span style="font-weight: 600">Why:</span> {{rec.reason}}</div>
      <div style="font-size: 15px"><span style="font-weight: 600">Next:</span> {{rec.action}}</div>
      <div style="color: #5B6270; font-size: 13px">{{rec.rule}}</div>
    </section>

    <section aria-label="Summary" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px">
        <div>
          <div style="color: #5B6270; font-size: 13px">Planned</div>
          <div style="font-size: 32px; font-weight: 600; margin-top: 4px">{{tot.planned}}</div>
          <div style="color: #5B6270; font-size: 13px">tests in the matrix</div>
        </div>
        <div>
          <div style="color: #5B6270; font-size: 13px">Executed</div>
          <div style="font-size: 32px; font-weight: 600; margin-top: 4px">{{tot.run}}</div>
          <div style="color: #5B6270; font-size: 13px">{{tot.execPct}} of planned · ran to a result</div>
        </div>
        <div>
          <div style="color: #5B6270; font-size: 13px">Passed</div>
          <div style="font-size: 32px; font-weight: 600; margin-top: 4px; color: #1F4FC4">{{tot.pass}}</div>
          <div style="color: #5B6270; font-size: 13px">{{tot.passPct}} of executed · {{tot.passOfPlanned}} of planned</div>
        </div>
        <a href="#failures" style="color: #16181D; text-decoration: none">
          <div style="color: #5B6270; font-size: 13px">Failed</div>
          <div style="font-size: 32px; font-weight: 600; margin-top: 4px; color: #B42318">{{tot.fail}}</div>
          <div style="color: #5B6270; font-size: 13px">executed, did not pass · <span style="color: #2457D6">see list</span></div>
        </a>
        <a href="#failures" style="color: #16181D; text-decoration: none">
          <div style="color: #5B6270; font-size: 13px">Blocked</div>
          <div style="font-size: 32px; font-weight: 600; margin-top: 4px; color: #8A4B00">{{tot.blocked}}</div>
          <div style="color: #5B6270; font-size: 13px">could not be executed · <span style="color: #2457D6">see list</span></div>
        </a>
      </div>
      <div>
        <div role="img" aria-label="{{tot.aria}}" style="display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #EEF0F3">
          <div style="width: {{tot.passW}}; background: #2457D6"></div>
          <div style="width: {{tot.failW}}; background: #B42318"></div>
          <div style="width: {{tot.blockedW}}; background: #E0A040"></div>
        </div>
        <div style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: #5B6270; margin-top: 8px">
          <span>{{tot.planned}} planned =</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #2457D6"></span>{{tot.pass}} passed</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B42318"></span>{{tot.fail}} failed</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E0A040"></span>{{tot.blocked}} blocked</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #EEF0F3"></span>{{tot.notRun}} not run yet</span>
          <span>· Executed = passed + failed.</span>
        </div>
      </div>
    </section>

    <section id="coverage" aria-label="Coverage by configuration" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div>
          <h2 style="margin: 0; font-size: 17px; font-weight: 600">Coverage by configuration</h2>
          <div style="color: #5B6270; font-size: 13px; margin-top: 2px">Each cell shows passed / planned for that test area · select a row for details</div>
        </div>
        <div role="group" aria-label="Filter configurations" style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
            <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="overflow-x: auto">
        <div style="min-width: 1080px">
          <div style="display: grid; grid-template-columns: 210px repeat(8, minmax(0, 1fr)) 150px; gap: 6px; padding: 0 0 8px; color: #5B6270; font-size: 13px; font-weight: 500">
            <div>Configuration</div>
            <sc-for list="{{cats}}" as="c" hint-placeholder-count="8"><div style="text-align: center">{{c}}</div></sc-for>
            <div>Passed · executed</div>
          </div>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="11">
            <button onClick="{{r.pick}}" aria-controls="details" aria-pressed="{{r.pressed}}" style="{{r.rowStyle}}">
              <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
                <span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px">{{r.id}} <span style="font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; color: #5B6270">{{r.product}}</span></span>
                <span style="font-size: 12px; color: #5B6270">{{r.os}}</span>
              </span>
              <sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="8">
                <span style="{{cell.style}}">{{cell.label}}</span>
              </sc-for>
              <span style="display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 13px">{{r.execLabel}}</span>
                <span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: #EEF0F3"><span style="width: {{r.passW}}; background: #2457D6"></span><span style="width: {{r.failW}}; background: #B42318"></span><span style="width: {{r.blockedW}}; background: #E0A040"></span></span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: #5B6270">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #2457D6"></span>All passed</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #DCE6FB"></span>In progress</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF; border: 1px dashed #8C93A0; box-sizing: border-box"></span>Not started</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FDECEA; border: 1px solid #B42318; box-sizing: border-box"></span>Failing or blocked</span>
        <span style="display: inline-flex; align-items: center; gap: 6px">— Not applicable</span>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 16px">
      <section id="details" aria-label="Selected configuration" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <h2 style="margin: 0; font-size: 17px; font-weight: 600"><span style="font-family: 'IBM Plex Mono', monospace">{{sel.id}}</span> · {{sel.desc}}</h2>
          <span style="font-size: 13px; font-weight: 500; color: {{sel.ink}}">{{sel.state}}</span>
        </div>
        <dl style="margin: 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 16px; font-size: 14px">
          <dt style="color: #5B6270">Modules</dt><dd style="margin: 0">{{sel.modules}}</dd>
          <dt style="color: #5B6270">OS</dt><dd style="margin: 0">{{sel.os}}</dd>
          <dt style="color: #5B6270">Firmware</dt><dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{sel.fw}}</dd>
          <dt style="color: #5B6270">Also supports</dt><dd style="margin: 0">{{sel.also}}</dd>
          <dt style="color: #5B6270">Progress</dt><dd style="margin: 0">{{sel.passLabel}} · {{sel.execLabel}}</dd>
        </dl>
        <div style="border-top: 1px solid #EEF0F3; padding-top: 12px">
          <div style="font-weight: 600; font-size: 14px">Open problems</div>
          <sc-if value="{{sel.hasIssues}}" hint-placeholder-val="{{ true }}">
            <ul style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
              <sc-for list="{{sel.issues}}" as="i" hint-placeholder-count="1">
                <li style="display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 12px; font-size: 14px; align-items: baseline">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{i.test}}</span>
                  <a href="#failures">{{i.name}}</a>
                  <span style="font-weight: 500; color: {{i.ink}}">{{i.result}}</span>
                </li>
              </sc-for>
            </ul>
          </sc-if>
          <sc-if value="{{sel.noIssues}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 8px 0 0; color: #5B6270; font-size: 14px">No failing or blocked tests.</p>
          </sc-if>
        </div>
      </section>

      <figure style="margin: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">
        <figcaption style="font-weight: 600">Progress by OS version</figcaption>
        <div style="color: #5B6270; font-size: 13px; margin-top: 2px">Passed of planned, across every configuration that ships each OS version</div>
        <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px">
          <sc-for list="{{osBars}}" as="o" hint-placeholder-count="7">
            <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) 72px; gap: 12px; align-items: center">
              <span style="font-size: 14px">{{o.name}}</span>
              <div style="display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: #EEF0F3">
                <div style="width: {{o.passW}}; background: #2457D6"></div>
                <div style="width: {{o.failW}}; background: #B42318"></div>
                <div style="width: {{o.blockedW}}; background: #E0A040"></div>
              </div>
              <span style="font-size: 13px; color: #5B6270; text-align: right">{{o.label}}</span>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: #5B6270; margin-top: 16px">
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #2457D6"></span>Passed</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #B42318"></span>Failed</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #E0A040"></span>Blocked</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #EEF0F3"></span>Not run</span>
        </div>
      </figure>
    </div>

    <section id="failures" aria-label="Open failures" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; overflow-x: auto">
      <div style="min-width: 820px">
        <div style="padding: 16px 20px 0">
          <h2 style="margin: 0; font-size: 17px; font-weight: 600">Failing and blocked tests</h2>
        </div>
        <div style="display: grid; grid-template-columns: 80px minmax(0, 2fr) 80px minmax(0, 1.2fr) 100px 90px; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #E3E6EB; color: #5B6270; font-size: 13px; font-weight: 500">
          <div>Test</div><div>Name</div><div>Config</div><div>OS</div><div>Result</div><div>Jira</div>
        </div>
        <sc-for list="{{issues}}" as="i" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 80px minmax(0, 2fr) 80px minmax(0, 1.2fr) 100px 90px; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #EEF0F3; font-size: 14px; align-items: baseline">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{i.test}}</span>
            <span>{{i.name}}<span style="display: block; color: #5B6270; font-size: 13px">{{i.note}}</span></span>
            <a href="#details" onClick="{{i.pick}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{i.config}}</a>
            <span>{{i.os}}</span>
            <span style="font-weight: 500; color: {{i.ink}}">{{i.result}}</span>
            <span title="Jira is not connected in the demo" style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5B6270">{{i.jira}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', selected: 'PN1-C', ago: 4, tick: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const ago = this.state.ago >= 9 ? 1 : this.state.ago + 1;
      this.setState({ ago: ago, tick: ago === 1 ? this.state.tick + 1 : this.state.tick });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  pct(a, b) {
    return b ? Math.round(a / b * 100) + '%' : '0%';
  }
  // bar widths: one decimal, so a single blocked test still shows up
  w(a, b) {
    return b ? (a / b * 100).toFixed(1) + '%' : '0%';
  }
  // Release recommendation, derived from the matrix: hold on any failed test,
  // wait while tests are blocked or not yet run, otherwise ship.
  recommend(built, issues, tot) {
    const rc = 'fw-2026.12.0-rc2';
    const fails = issues.filter((i) => i.result === 'Fail');
    const blocked = issues.filter((i) => i.result === 'Blocked');
    const done = built.filter((c) => !c.bad && c.run === c.planned_n).length;
    const rule = 'Hold on any failed test · wait while tests are blocked or not run · otherwise ship. Derived from the simulated matrix on this page.';
    if (fails.length) {
      const cfgs = fails.map((i) => i.config).filter((v, k, a) => a.indexOf(v) === k);
      return {
        verdict: 'Hold ' + rc, ink: '#B42318', bg: '#FDF3F2', border: '#F5C6C1', rule: rule,
        reason: fails.length + ' tests failed on ' + cfgs.join(', ') + (blocked.length ? ', and ' + blocked.length + ' more is blocked.' : '.'),
        action: 'Fix ' + fails.map((i) => i.test + ' (' + i.jira + ')').join(', ') + (blocked.length ? ' and unblock ' + blocked.map((i) => i.test).join(', ') : '') + ' before cutting rc3. ' + done + ' of ' + built.length + ' configurations are already complete.'
      };
    }
    const left = tot.planned - tot.run;
    if (left > 0) {
      return { verdict: 'Wait on ' + rc, ink: '#8A4B00', bg: '#FFF8EE', border: '#F2D6AE', rule: rule,
        reason: 'no failures, but ' + left + ' planned tests have not been executed' + (blocked.length ? ' (' + blocked.length + ' blocked)' : '') + '.',
        action: 'Finish the remaining runs before the Dec 9 target.' };
    }
    return { verdict: 'Ship ' + rc, ink: '#1F7A4D', bg: '#F1F8F4', border: '#BFDCCB', rule: rule,
      reason: 'every planned test was executed and passed.', action: 'Promote ' + rc + ' to release.' };
  }
  renderVals() {
    const cats = ['Provisioning', 'Security', 'Networking', 'Compute', 'Power', 'Interop', 'Environ.', 'Perf.'];
    const live = 0.3 + 0.08 * (this.state.tick % 6);
    const configs = [
      { id: 'PN1-A', product: 'Pocket Node', group: 'pn', desc: 'Pocket Node, base', os: 'EdgeOS 3.2 LTS', fw: 'FW 1.8', modules: 'Wi-Fi and USB only', also: 'EdgeOS 3.4, 4.0 (target)', planned: [4, 2, 3, 2, 2, 3, 0, 0], prog: 1 },
      { id: 'PN1-B', product: 'Pocket Node', group: 'pn', desc: 'Pocket Node, cellular', os: 'EdgeOS 3.4', fw: 'FW 1.9', modules: 'Wi-Fi, cellular, GNSS', also: 'EdgeOS 3.2 LTS, 4.0 (target)', planned: [5, 2, 5, 2, 2, 3, 0, 1], prog: 1 },
      { id: 'PN1-C', product: 'Pocket Node', group: 'pn', desc: 'Pocket Node, secure', os: 'EdgeOS 4.0 (beta)', fw: 'FW 2.0', modules: 'Cellular, GNSS, zeroize enabled', also: 'EdgeOS 3.2 LTS, 3.4', planned: [5, 3, 3, 2, 2, 3, 1, 1], prog: 0.7, fail: { 1: 1 } },
      { id: 'FC6-A', product: 'Field Chassis', group: 'fc', desc: 'Field Chassis, general compute', os: 'Host Linux 22.04 LTS', fw: 'BIOS 3.1 / BMC 2.4', modules: '2× Compute Blade (x86), Switch Blade, Link Blade (Wi-Fi/Cell)', also: 'Host Linux 24.04, Hypervisor 8.0 U3 and 9.0', planned: [4, 2, 5, 1, 3, 3, 0, 1], prog: 1 },
      { id: 'FC6-B', product: 'Field Chassis', group: 'fc', desc: 'Field Chassis, GPU', os: 'Host Linux 24.04 LTS', fw: 'BIOS 3.2 / BMC 2.5', modules: 'Compute Blade (GPU), Compute Blade (x86), Switch Blade, Link Blade (Wi-Fi/Cell)', also: 'Host Linux 22.04 (deprecated), Hypervisor 8.0 U3 and 9.0', planned: [4, 2, 5, 2, 3, 3, 0, 0], prog: 0.85 },
      { id: 'FC6-C', product: 'Field Chassis', group: 'fc', desc: 'Field Chassis, comms-heavy', os: 'EdgeOS 4.0 (beta)', fw: 'BIOS 3.2 / BMC 2.5', modules: 'Compute Blade (x86), Switch Blade, Link Blade (Wi-Fi/Cell), 2× Link Blade (Radio)', also: 'EdgeOS 3.2 LTS, 3.4', planned: [5, 2, 6, 1, 3, 3, 1, 1], prog: 0.5, blocked: { 2: 1 } },
      { id: 'RBK-A', product: 'Radio Bridge Kit', group: 'rbk', desc: 'Radio Bridge Kit, standard', os: 'EdgeOS 3.4', fw: 'FW 1.9', modules: 'Compute and 2 radio ports', also: 'EdgeOS 3.2 LTS, 4.0 (target)', planned: [5, 2, 3, 1, 1, 3, 0, 0], prog: 1 },
      { id: 'RBK-B', product: 'Radio Bridge Kit', group: 'rbk', desc: 'Radio Bridge Kit, encrypted', os: 'EdgeOS 4.0 (beta)', fw: 'FW 2.0 / Crypto 5.1', modules: 'Compute, 4 radio ports, inline encryptor', also: 'EdgeOS 3.4', planned: [5, 4, 3, 1, 1, 3, 1, 1], prog: 0.6, fail: { 1: 1 } },
      { id: 'MTS-A', product: 'Multi-Tenant Server', group: 'mts', desc: 'Multi-Tenant Server, 2 enclaves', os: 'Hypervisor 8.0 U3', fw: 'BIOS 3.1 / BMC 2.4', modules: 'Compute Blade (x86), Switch Blade', also: 'Hypervisor 9.0', planned: [5, 3, 3, 2, 1, 3, 0, 1], prog: 1 },
      { id: 'MTS-B', product: 'Multi-Tenant Server', group: 'mts', desc: 'Multi-Tenant Server, 4 enclaves', os: 'Hypervisor 9.0', fw: 'BIOS 3.2 / BMC 2.5', modules: 'Compute Blade (x86), Compute Blade (GPU), Switch Blade', also: 'Hypervisor 8.0 U3 (deprecated)', planned: [5, 3, 3, 3, 1, 3, 0, 0], prog: 0.75, fail: { 3: 1 } },
      { id: 'GK-A', product: 'Go-Kit', group: 'gk', desc: 'Go-Kit, full stack', os: 'Host Linux 24.04 + Hypervisor 9.0', fw: 'BIOS 3.2 / BMC 2.5', modules: 'FC6-B and MTS-B in a transit case', also: 'None, fixed image', planned: [4, 4, 5, 4, 2, 3, 0, 1], prog: live }
    ];
    const issueList = [
      { test: 'SEC-03', name: 'Zeroize / emergency secure erase', note: 'Data partition survives erase on second boot', config: 'PN1-C', os: 'EdgeOS 4.0 (beta)', result: 'Fail', jira: 'EDGE-412' },
      { test: 'SEC-05', name: 'Inline encryptor key load and failover', note: 'Failover takes 41 s against a 10 s target', config: 'RBK-B', os: 'EdgeOS 4.0 (beta)', result: 'Fail', jira: 'EDGE-418' },
      { test: 'CMP-04', name: 'Guest OS compatibility', note: 'Windows Server 2025 guest loses NIC after snapshot restore', config: 'MTS-B', os: 'Hypervisor 9.0', result: 'Fail', jira: 'EDGE-421' },
      { test: 'NET-06', name: 'Radio-to-IP bridging across all radio ports', note: 'Waiting on second radio unit for the lab', config: 'FC6-C', os: 'EdgeOS 4.0 (beta)', result: 'Blocked', jira: 'EDGE-409' }
    ].map((i) => Object.assign({}, i, { ink: i.result === 'Fail' ? '#B42318' : '#8A4B00' }));

    const tot = { planned: 0, run: 0, pass: 0, fail: 0, blocked: 0 };
    const byOs = {};
    const built = configs.map((c) => {
      let planned = 0, run = 0, pass = 0, bad = 0, fails = 0, blocks = 0;
      const cells = c.planned.map((p, k) => {
        const base = 'display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 6px; font-size: 13px; ';
        if (!p) return { label: '—', style: base + 'color: #6B7280; background: #F6F7F9' };
        const f = (c.fail && c.fail[k]) || 0, b = (c.blocked && c.blocked[k]) || 0;
        // r = tests touched so far; blocked ones never ran, so executed = r - blocked
        const r = Math.max(Math.min(p, Math.round(p * c.prog)), f + b);
        const ok = r - f - b;
        planned += p; run += r - b; pass += ok; bad += f + b; fails += f; blocks += b;
        tot.fail += f; tot.blocked += b;
        if (f || b) return { label: ok + '/' + p + (f ? ' · fail' : ' · blocked'), style: base + 'background: #FDECEA; color: #B42318; font-weight: 600; border: 1px solid #B42318' };
        if (r === p) return { label: ok + '/' + p, style: base + 'background: #2457D6; color: #FFFFFF; font-weight: 500' };
        if (r === 0) return { label: '0/' + p, style: base + 'background: #FFFFFF; color: #5B6270; border: 1px dashed #8C93A0' };
        return { label: ok + '/' + p, style: base + 'background: #DCE6FB; color: #16181D' };
      });
      tot.planned += planned; tot.run += run; tot.pass += pass;
      const osKey = c.id === 'GK-A' ? 'Host Linux 24.04 LTS' : c.os;
      const o = byOs[osKey] || (byOs[osKey] = { planned: 0, pass: 0, fail: 0, blocked: 0 });
      o.planned += planned; o.pass += pass; o.fail += fails; o.blocked += blocks;
      const state = bad ? (c.fail ? 'Failing' : 'Blocked') : (run === planned ? 'Complete' : (run ? 'In progress' : 'Not started'));
      const ink = bad ? (c.fail ? '#B42318' : '#8A4B00') : (run === planned ? '#1F7A4D' : '#5B6270');
      return Object.assign({}, c, { cells: cells, planned_n: planned, run: run, pass: pass, bad: bad, fails: fails, blocks: blocks, state: state, ink: ink });
    });

    const f = this.state.filter;
    const shown = built.filter((c) => f === 'all' || (f === 'attention' ? c.bad > 0 : c.group === f));
    const pill = (on) => 'min-height: 40px; padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid ' + (on ? '#2457D6' : '#D5D9E0') + '; background: ' + (on ? '#2457D6' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#16181D');
    const filters = [
      { id: 'all', label: 'All' }, { id: 'attention', label: 'Needs attention' },
      { id: 'pn', label: 'Pocket Node' }, { id: 'fc', label: 'Field Chassis' },
      { id: 'rbk', label: 'Radio Bridge Kit' }, { id: 'mts', label: 'Multi-Tenant Server' }, { id: 'gk', label: 'Go-Kit' }
    ].map((x) => ({ label: x.label, style: pill(x.id === f), pick: () => this.setState({ filter: x.id }) }));

    const rec = this.recommend(built, issueList, tot);
    const selC = built.find((c) => c.id === this.state.selected) || built[0];
    const selIssues = issueList.filter((i) => i.config === selC.id);
    const osOrder = ['EdgeOS 3.2 LTS', 'EdgeOS 3.4', 'EdgeOS 4.0 (beta)', 'Host Linux 22.04 LTS', 'Host Linux 24.04 LTS', 'Hypervisor 8.0 U3', 'Hypervisor 9.0'];

    return {
      ago: this.state.ago,
      cats: cats,
      filters: filters,
      rec: rec,
      tot: {
        planned: tot.planned, run: tot.run, pass: tot.pass, fail: tot.fail, blocked: tot.blocked,
        notRun: tot.planned - tot.run - tot.blocked,
        execPct: this.pct(tot.run, tot.planned), passPct: this.pct(tot.pass, tot.run), passOfPlanned: this.pct(tot.pass, tot.planned),
        passW: this.w(tot.pass, tot.planned), failW: this.w(tot.fail, tot.planned), blockedW: this.w(tot.blocked, tot.planned),
        aria: tot.planned + ' planned: ' + tot.pass + ' passed, ' + tot.fail + ' failed, ' + tot.blocked + ' blocked, ' + (tot.planned - tot.run - tot.blocked) + ' not run yet'
      },
      rows: shown.map((c) => {
        const on = c.id === selC.id;
        return {
          id: c.id, product: c.product, os: c.os, cells: c.cells,
          execLabel: c.pass + ' passed · ' + c.run + ' of ' + c.planned_n + ' executed',
          passW: this.w(c.pass, c.planned_n), failW: this.w(c.fails, c.planned_n), blockedW: this.w(c.blocks, c.planned_n),
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ selected: c.id }),
          rowStyle: 'width: 100%; display: grid; grid-template-columns: 210px repeat(8, minmax(0, 1fr)) 150px; gap: 6px; align-items: center; padding: 8px; margin: 0 0 4px; border-radius: 8px; font: inherit; color: #16181D; cursor: pointer; text-align: left; border: 1px solid ' + (on ? '#2457D6' : 'transparent') + '; background: ' + (on ? '#F3F6FD' : '#FFFFFF')
        };
      }),
      sel: {
        id: selC.id, desc: selC.desc, os: selC.os, fw: selC.fw, modules: selC.modules, also: selC.also,
        state: selC.state, ink: selC.ink,
        execLabel: selC.run + ' of ' + selC.planned_n + ' executed' + (selC.fails ? ', ' + selC.fails + ' failed' : '') + (selC.blocks ? ', ' + selC.blocks + ' blocked' : ''),
        passLabel: selC.pass + ' passed',
        issues: selIssues, hasIssues: selIssues.length > 0, noIssues: selIssues.length === 0
      },
      osBars: osOrder.map((n) => {
        const o = byOs[n];
        return { name: n, passW: this.w(o.pass, o.planned), failW: this.w(o.fail, o.planned), blockedW: this.w(o.blocked, o.planned), label: o.pass + '/' + o.planned };
      }),
      issues: issueList.map((i) => Object.assign({}, i, { pick: () => this.setState({ selected: i.config, filter: 'all' }) }))
    };
  }
}
</script>
