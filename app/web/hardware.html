<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hardware · Release Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:#2457D6}a:hover{color:#1A3FA0}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:20px 24px}
h2{margin:0;font-size:17px;font-weight:600}
.card>.row:first-child{border-top:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 0;border-top:1px solid #EEF0F3;font-size:14px}
.muted{color:#5B6270}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid #EEF0F3}
th{font-weight:500;color:#5B6270;font-size:13px;border-top:0}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F7F9; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="/" aria-label="Release Tool home" style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #16181D; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="#2457D6" stroke-width="2"></rect><path d="M8 18l5-8 3 5 4-6" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-weight: 600; font-size: 17px">Release Tool</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
        <a href="/" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Releases</a>
        <a href="/hardware.html" aria-current="page" style="padding: 10px 14px; border-radius: 8px; background: #EEF2FC; color: #16181D; text-decoration: none; font-weight: 500">Hardware</a>
        <a href="/integrations.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Integrations</a>
        <a href="/connections.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Connections</a>
      </nav>
      <span></span>
    </div>
  </header>
  <main style="max-width: 1180px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 20px">
    <div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600">Hardware</h1>
      <p style="margin: 6px 0 0" class="muted">How far each release's build has got through the hardware and OS test matrix.</p>
    </div>
    <div id="picker" role="tablist" aria-label="Release" style="display: flex; gap: 8px; flex-wrap: wrap"></div>
    <section class="card" id="head" aria-live="polite"></section>
    <section class="card" style="overflow-x: auto">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap">
        <h2>By hardware setup</h2><span class="muted" style="font-size: 13px" id="src"></span>
      </div>
      <div id="grid" style="min-width: 900px; margin-top: 12px"></div>
      <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 12px" class="muted">
        <span><span class="sw" style="background: #1F7A4D"></span>All passed</span>
        <span><span class="sw" style="background: #9ECFB2"></span>In progress</span>
        <span><span class="sw" style="background: #B42318"></span>Failed or blocked</span>
        <span><span class="sw" style="background: #E3E6EB"></span>Not run yet</span>
      </div>
    </section>
    <section class="card" id="problems"></section>
  </main>
<script>
(function () {
  var line = null, releases = [];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function pick(l) { line = l; try { history.replaceState(null, '', '?line=' + l); } catch (e) {} renderPicker(); loadDetail(); }
  function renderPicker() {
    document.getElementById('picker').innerHTML = releases.map(function (r) {
      var on = r.line === line;
      return '<button type="button" role="tab" aria-selected="' + on + '" data-line="' + esc(r.line) + '" style="min-height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-weight: 500; cursor: pointer; border: 1px solid ' + (on ? '#2457D6' : '#D5D9E0') + '; background: ' + (on ? '#2457D6' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#16181D') + '">' + esc(r.name) + '</button>';
    }).join('');
    document.querySelectorAll('#picker button').forEach(function (b) { b.onclick = function () { pick(b.getAttribute('data-line')); }; });
  }
  function loadList() {
    return fetch('/api/releases').then(function (r) { return r.json(); }).then(function (d) {
      releases = d.inFlight.filter(function (r) { return r.candidate; }).concat(d.shipped);
      var want = new URLSearchParams(location.search).get('line');
      if (!line) line = (releases.find(function (r) { return r.line === want; }) || releases[0] || {}).line;
      renderPicker();
    });
  }
  function loadDetail() {
    if (!line) { document.getElementById('head').innerHTML = '<p class="muted" style="margin: 0">No builds to show yet.</p>'; return; }
    fetch('/api/releases/' + line).then(function (r) { return r.json(); }).then(render).catch(function () {});
  }
  function render(d) {
    var m = d.matrix, t = d.tests.matrix;
    var head = document.getElementById('head');
    if (!m || !t) { head.innerHTML = '<p class="muted" style="margin: 0">No test matrix imported yet.</p>'; return; }
    var run = t.pass + t.fail + t.blocked, pct = function (n) { return (n / t.planned * 100).toFixed(1) + '%'; };
    var color = t.fail || t.blocked ? '#B42318' : run === t.planned ? '#1F7A4D' : '#8A4B00';
    head.innerHTML = '<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">' +
      '<div><div style="font-size: 24px; font-weight: 600">' + t.pass + ' of ' + t.planned + ' tests passed</div>' +
      '<div class="muted" style="margin-top: 2px">' + esc(d.name) + ' build <span style="font-family: \'IBM Plex Mono\', monospace">' + esc(d.candidate ? d.candidate.version : '') + '</span> · ' + t.completeConfigs + ' of ' + t.configs + ' hardware setups done</div></div>' +
      '<div style="font-weight: 600; color: ' + color + '">' + (t.fail || t.blocked ? (t.fail ? t.fail + ' failed' : '') + (t.fail && t.blocked ? ', ' : '') + (t.blocked ? t.blocked + ' blocked' : '') : run === t.planned ? 'All passed' : (t.planned - run) + ' still to run') + '</div></div>' +
      '<div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #EEF0F3; margin-top: 12px"><span style="width: ' + pct(t.pass) + '; background: #1F7A4D"></span><span style="width: ' + pct(t.fail + t.blocked) + '; background: #B42318"></span></div>';
    document.getElementById('src').textContent = 'Plan from ' + m.source + ' · results from Zephyr' + (d.sources.zephyr ? '' : ' (simulated)');
    var cols = '230px repeat(' + m.categories.length + ', minmax(0, 1fr)) 90px';
    var g = '<div style="display: grid; grid-template-columns: ' + cols + '; gap: 6px; font-size: 12px; font-weight: 500; padding-bottom: 6px" class="muted"><span>Setup</span>' +
      m.categories.map(function (c) { return '<span style="text-align: center">' + esc(c) + '</span>'; }).join('') + '<span style="text-align: right">Passed</span></div>';
    m.configs.forEach(function (c) {
      g += '<div style="display: grid; grid-template-columns: ' + cols + '; gap: 6px; align-items: center; padding: 3px 0">' +
        '<span style="font-size: 13px"><span style="font-family: \'IBM Plex Mono\', monospace; font-weight: 500">' + esc(c.id) + '</span> <span class="muted">' + esc(c.os) + '</span></span>' +
        c.cells.map(function (x, i) {
          if (!x.planned) return '<span></span>';
          var bg = x.bad ? '#B42318' : x.pass === x.planned ? '#1F7A4D' : x.pass ? '#9ECFB2' : '#E3E6EB';
          var ink = x.bad || x.pass === x.planned ? '#FFFFFF' : '#16181D';
          return '<span title="' + esc(m.categories[i]) + ': ' + x.pass + ' of ' + x.planned + ' passed" style="height: 26px; border-radius: 4px; background: ' + bg + '; color: ' + ink + '; font-size: 12px; display: flex; align-items: center; justify-content: center">' + x.pass + '/' + x.planned + '</span>';
        }).join('') +
        '<span style="text-align: right; font-size: 13px">' + c.pass + ' / ' + c.planned + '</span></div>';
    });
    document.getElementById('grid').innerHTML = g;
    var p = document.getElementById('problems');
    p.innerHTML = '<h2>Failed and blocked</h2>' + (m.problems.length ? m.problems.map(function (x) {
      var f = x.outcome === 'fail';
      return '<div class="row"><span style="flex: 0 0 70px; font-weight: 600; color: ' + (f ? '#B42318' : '#8A4B00') + '">' + (f ? 'Failed' : 'Blocked') + '</span><span style="flex: 1 1 260px">' + esc(x.name) + '</span><span class="muted" style="font-family: \'IBM Plex Mono\', monospace; font-size: 13px">' + esc(x.testId) + ' on ' + esc(x.configId) + '</span></div>';
    }).join('') : '<p class="muted" style="margin: 10px 0 0">Nothing failed or blocked on this build.</p>');
  }
  loadList().then(loadDetail);
  try { new EventSource('/api/stream').addEventListener('change', function () { loadList().then(loadDetail); }); } catch (e) {}
})();
</script>
</div>
</body>
</html>
