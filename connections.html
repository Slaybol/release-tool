<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connections</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="morphdom.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-src">
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:#2457D6}a:hover{color:#1A3FA0}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F7F9; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="index.html" aria-label="Release Tool home" style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #16181D; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="#2457D6" stroke-width="2"></rect><path d="M8 18l5-8 3 5 4-6" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-weight: 600; font-size: 17px">Release Tool</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
        <a href="index.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Releases</a>
        <a href="integrations.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Integrations</a>
        <a href="connections.html" aria-current="page" style="padding: 10px 14px; border-radius: 8px; background: #EEF2FC; color: #16181D; text-decoration: none; font-weight: 500">Connections</a>
      </nav>
      <span title="Every number on this page is made up for the mockup." style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; background: #FFF3E0; color: #8A4B00; font-size: 13px; font-weight: 500"><span style="width: 8px; height: 8px; border-radius: 50%; background: #C26A00"></span>Demo · simulated data</span>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 600">Connections</h1>
        <p style="margin: 6px 0 0; color: #5B6270">The tools Release Tool reads from, and what each one feeds. States below are examples: nothing is connected in the demo.</p>
      </div>
      <div role="group" aria-label="Filter connections" style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
          <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>

    <section aria-label="Summary" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
      <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">
        <div style="color: #5B6270; font-size: 13px">Connected</div>
        <div style="font-size: 32px; font-weight: 600; margin-top: 4px; color: #1F7A4D">{{sum.on}}</div>
        <div style="color: #5B6270; font-size: 13px">of {{sum.total}} tools</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">
        <div style="color: #5B6270; font-size: 13px">Need attention</div>
        <div style="font-size: 32px; font-weight: 600; margin-top: 4px; color: #8A4B00">{{sum.warn}}</div>
        <div style="color: #5B6270; font-size: 13px">sync errors or expiring keys</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">
        <div style="color: #5B6270; font-size: 13px">Not connected</div>
        <div style="font-size: 32px; font-weight: 600; margin-top: 4px">{{sum.off}}</div>
        <div style="color: #5B6270; font-size: 13px">features hidden until added</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">
        <div style="color: #5B6270; font-size: 13px">Events, last 24h</div>
        <div style="font-size: 32px; font-weight: 600; margin-top: 4px">{{sum.events}}</div>
        <div style="color: #5B6270; font-size: 13px">across connected tools</div>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; align-items: start">
      <section aria-label="Tools" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px">
        <sc-for list="{{tools}}" as="t" hint-placeholder-count="8">
          <button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" aria-controls="tool-details" style="{{t.card}}">
            <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%">
              <span style="display: inline-flex; align-items: center; gap: 10px">
                <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 8px; background: #FFFFFF; border: 1px solid #E3E6EB; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex: none">
                  <sc-if value="{{t.hasLogo}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24"><path d="{{t.logo}}" fill="{{t.hex}}"></path></svg></sc-if>
                  <sc-if value="{{t.noLogo}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M9 4h6M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 11l2 2 4-4M9 17h6" fill="none" stroke="#5B6270" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
                </span>
                <span style="font-weight: 600">{{t.name}}</span>
              </span>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: {{t.ink}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}}"></span>{{t.stateLabel}}</span>
            </span>
            <span style="font-size: 13px; color: #5B6270">{{t.category}}</span>
            <span style="font-size: 14px">{{t.summary}}</span>
            <span style="font-size: 13px; color: #5B6270">{{t.sync}}</span>
          </button>
        </sc-for>
      </section>

      <section id="tool-details" aria-label="Selected tool" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <span style="display: inline-flex; align-items: center; gap: 12px">
                <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 8px; background: #FFFFFF; border: 1px solid #E3E6EB; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; flex: none">
                  <sc-if value="{{sel.hasLogo}}" hint-placeholder-val="{{ true }}"><svg width="26" height="26" viewBox="0 0 24 24"><path d="{{sel.logo}}" fill="{{sel.hex}}"></path></svg></sc-if>
                  <sc-if value="{{sel.noLogo}}" hint-placeholder-val="{{ false }}"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 4h6M8 3h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 11l2 2 4-4M9 17h6" fill="none" stroke="#5B6270" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
                </span>
            <h2 style="margin: 0; font-size: 20px; font-weight: 600">{{sel.name}}</h2>
          </span>
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{sel.ink}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{sel.dot}}"></span>{{sel.stateLabel}}</span>
        </div>
        <sc-if value="{{sel.hasAlert}}" hint-placeholder-val="{{ false }}">
          <div style="background: #FFF8EE; border: 1px solid #F2D6AE; border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #8A4B00">{{sel.alert}}</div>
        </sc-if>
        <div>
          <div style="font-weight: 600; font-size: 14px">What it feeds</div>
          <ul style="margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 14px">
            <sc-for list="{{sel.feeds}}" as="x" hint-placeholder-count="3"><li>{{x}}</li></sc-for>
          </ul>
        </div>
        <div>
          <div style="font-weight: 600; font-size: 14px">Mapping</div>
          <dl style="margin: 8px 0 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; font-size: 14px">
            <sc-for list="{{sel.mapping}}" as="m" hint-placeholder-count="3">
              <dt style="color: #5B6270">{{m.k}}</dt><dd style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px">{{m.v}}</dd>
            </sc-for>
          </dl>
        </div>
        <dl style="margin: 0; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; font-size: 14px; border-top: 1px solid #EEF0F3; padding-top: 12px">
          <dt style="color: #5B6270">Access</dt><dd style="margin: 0">{{sel.scope}}</dd>
          <dt style="color: #5B6270">Sync</dt><dd style="margin: 0">{{sel.sync}}</dd>
          <dt style="color: #5B6270">Events, 24h</dt><dd style="margin: 0">{{sel.events}}</dd>
        </dl>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" disabled title="Not available in the demo" style="min-height: 44px; padding: 0 16px; border: 1px dashed #C4C9D2; border-radius: 8px; background: #F6F7F9; color: #6B7280; font: inherit; cursor: not-allowed">{{sel.primary}}</button>
          <button type="button" disabled title="Not available in the demo" style="min-height: 44px; padding: 0 16px; border: 1px dashed #C4C9D2; border-radius: 8px; background: #F6F7F9; color: #6B7280; font: inherit; cursor: not-allowed">Sync now</button>
        </div>
      </section>
    </div>
  </main>
</div>
</template>

    const look = {
      on: { label: 'Connected', ink: '#1F7A4D', dot: '#1F7A4D', primary: 'Manage' },
      warn: { label: 'Needs attention', ink: '#8A4B00', dot: '#C26A00', primary: 'Renew key' },
      off: { label: 'Not connected', ink: '#5B6270', dot: '#B8BEC9', primary: 'Connect' }
    };
    const sum = { total: tools.length, on: 0, warn: 0, off: 0, events: 0 };
    tools.forEach((t) => { sum[t.state]++; sum.events += t.events; });
    sum.on += sum.warn; // needs attention is still connected
    sum.events = sum.events.toLocaleString('en-US');

    const f = this.state.filter;
    const pill = (on) => 'min-height: 40px; padding: 8px 16px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid ' + (on ? '#2457D6' : '#D5D9E0') + '; background: ' + (on ? '#2457D6' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#16181D');
    const filters = [
      { id: 'all', label: 'All' }, { id: 'on', label: 'Connected' }, { id: 'warn', label: 'Needs attention' }, { id: 'off', label: 'Not connected' }
    ].map((x) => ({ label: x.label, style: pill(x.id === f), pick: () => this.setState({ filter: x.id }) }));
    const shown = tools.filter((t) => f === 'all' || (f === 'on' ? t.state !== 'off' : t.state === f));
    const s = tools.find((t) => t.id === this.state.sel) || tools[0];

    return {
      filters: filters,
      sum: sum,
      tools: shown.map((t) => {
        const on = t.id === s.id, L = look[t.state];
        return {
          name: t.name, logo: t.logo ? logos[t.logo].d : '', hex: t.logo ? logos[t.logo].hex : '', hasLogo: !!t.logo, noLogo: !t.logo, category: t.category, summary: t.summary, sync: t.sync,
          stateLabel: L.label, ink: L.ink, dot: L.dot, pressed: on ? 'true' : 'false',
          pick: () => this.setState({ sel: t.id }),
          card: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 12px; font: inherit; color: #16181D; text-align: left; cursor: pointer; background: ' + (on ? '#F3F6FD' : '#FFFFFF') + '; border: 1px ' + (t.state === 'off' ? 'dashed' : 'solid') + ' ' + (on ? '#2457D6' : '#E3E6EB')
        };
      }),
      sel: {
        name: s.name, logo: s.logo ? logos[s.logo].d : '', hex: s.logo ? logos[s.logo].hex : '', hasLogo: !!s.logo, noLogo: !s.logo, stateLabel: look[s.state].label, ink: look[s.state].ink, dot: look[s.state].dot, primary: look[s.state].primary,
        hasAlert: !!s.alert, alert: s.alert || '', feeds: s.feeds, mapping: s.mapping, scope: s.scope, sync: s.sync,
        events: s.events ? s.events.toLocaleString('en-US') : 'None'
      }
    };
  }
