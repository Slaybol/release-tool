        </svg>

          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #C9D6F5"></span>Build</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #7E9BE6"></span>Test</span>

      <figure style="margin: 0; background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; padding: 20px">

          <text x="24" y="164" text-anchor="end" font-size="11" fill="#5B6270">0</text>

          <text x="280" y="188" text-anchor="middle" font-size="11" fill="#5B6270">today</text>
          <text x="432" y="188" text-anchor="end" font-size="11" fill="#5B6270">Oct 14</text>

        <div style="display: flex; gap: 20px; font-size: 13px; color: #5B6270; margin-top: 4px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: false, ago: 2, tick: 0, notesTab: 'notes' };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const ago = this.state.ago >= 9 ? 1 : this.state.ago + 1;
      this.setState({ ago: ago, tick: ago === 1 ? this.state.tick + 1 : this.state.tick });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  line(values, max) {
    return values.map((v, i) => (i ? 'L' : 'M') + (32 + i * 400 / (values.length - 1)).toFixed(1) + ' ' + (160 - v / max * 140).toFixed(1)).join(' ');
  }
  // Release recommendation, derived from the same data the charts show.
  // Rule: hold when the candidate's errors per hour exceed the threshold;
  // otherwise wait while Jira issues are open; otherwise ship.
  recommend(d) {
    const ERR_THRESHOLD = 8;
    const now = d.errNow[d.errNow.length - 1];
    const base = Math.round(d.errPrev.reduce((a, b) => a + b, 0) / d.errPrev.length);
    const fallback = d.builds.find((b) => b.state === 'Passed' && b.id !== d.candidate);
    const rule = 'Hold if errors exceed ' + ERR_THRESHOLD + ' per hour · wait while Jira issues are open · otherwise ship. Derived from the simulated data on this page.';
    const red = { ink: '#B42318', bg: '#FDF3F2', border: '#F5C6C1' };
    const amber = { ink: '#8A4B00', bg: '#FFF8EE', border: '#F2D6AE' };
    const green = { ink: '#1F7A4D', bg: '#F1F8F4', border: '#BFDCCB' };
    if (now > ERR_THRESHOLD) {
      return Object.assign({
        verdict: 'Hold ' + d.candidate,
        reason: 'errors are at ' + now + ' per hour, above the ' + ERR_THRESHOLD + ' per hour threshold' + (fallback ? ' (' + fallback.id + ' runs at about ' + base + ').' : '.'),
        action: 'Investigate the regression in ' + d.candidate + (fallback ? '; ' + fallback.id + ' is available as a fallback.' : '.'),
        rule: rule
      }, red);
    }
    if (d.jiraOpen > 0) {
      return Object.assign({
        verdict: 'Wait on ' + d.candidate,
        reason: 'errors are within threshold, but ' + d.jiraOpen + ' Jira issues are still open.',
        action: 'Close or defer the open issues before the target date.',
        rule: rule
      }, amber);
    }
    return Object.assign({ verdict: 'Ship ' + d.candidate, reason: 'errors are within threshold and no Jira issues are open.', action: 'Promote ' + d.candidate + ' to production.', rule: rule }, green);
  }
  renderVals() {
    const t = this.state.tick % 3;
    const s1842 = 412 + t * 7;
    const sessions = [
      { id: 'b1838', value: 518, users: 61, fill: '#C9D6F5' },
      { id: 'b1840', value: 297, users: 40, fill: '#7E9BE6' },
