<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="demo-api.js"></script>
<title>Integrations · Release Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:#2457D6}a:hover{color:#1A3FA0}
.card{background:#FFFFFF;border:1px solid #E3E6EB;border-radius:12px;padding:20px 24px}
h2{margin:0;font-size:17px;font-weight:600}
.card>.row:first-child{border-top:0}
.row{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 0;border-top:1px solid #EEF0F3;font-size:14px}
.muted{color:#5B6270}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid #EEF0F3}
th{font-weight:500;color:#5B6270;font-size:13px;border-top:0}
body{padding-bottom:72px}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F6F7F9; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="index.html" aria-label="Release Tool home" style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #16181D; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="none" stroke="#2457D6" stroke-width="2"></rect><path d="M8 18l5-8 3 5 4-6" fill="none" stroke="#2457D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-weight: 600; font-size: 17px">Release Tool</span>
      </a>
      <nav aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
        <a href="index.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Releases</a>
        <a href="integrations.html" aria-current="page" style="padding: 10px 14px; border-radius: 8px; background: #EEF2FC; color: #16181D; text-decoration: none; font-weight: 500">Integrations</a>
        <a href="connections.html" style="padding: 10px 14px; border-radius: 8px; color: #16181D; text-decoration: none; font-weight: 500">Connections</a>
      </nav>
      <span></span>
    </div>
  </header>
  <main style="max-width: 1080px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 20px">
    <div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600">Integrations</h1>
      <p style="margin: 6px 0 0" class="muted">Does each release still work with the services and partner products it talks to?</p>
    </div>
    <section class="card" id="headline" aria-live="polite"></section>
    <section class="card" style="overflow-x: auto">
      <h2>Contract tests by release</h2>
      <table style="margin-top: 8px; min-width: 520px" id="grid"></table>
      <p class="muted" style="margin: 12px 0 0; font-size: 13px">Sample data. In use, results come from each release's contract test runs in GitHub Actions.</p>
    </section>
  </main>
<script>
(function () {
  var targets = [
    { id: 'billing', name: 'Billing API 2.8', kind: 'Service, in production', tests: 24 },
    { id: 'identity', name: 'Identity service 3.5', kind: 'Service, in production', tests: 12 },
    { id: 'payments', name: 'Payments partner API v3', kind: 'Partner product', tests: 18 },
    { id: 'push', name: 'Push notification service', kind: 'Partner product', tests: 6 }
  ];
  // Sample results: the first 4.13 build breaks checkout against the payments partner; its fix passes.
  function result(r, t) {
    if (!r.candidate) return { state: 'none', label: 'Not built yet' };
    if (r.line === '4.13' && /-rc\.1$/.test(r.candidate.version) && t.id === 'payments')
      return { state: 'fail', label: '15 of 18 pass', why: 'Checkout times out against ' + t.name + ' under load (WEB-2179).' };
    return { state: 'pass', label: t.tests + ' of ' + t.tests + ' pass' };
  }
  var look = { pass: ['✓', '#1F7A4D'], fail: ['✕', '#B42318'], none: ['–', '#8C93A0'] };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render(d) {
    var rel = d.inFlight;
    var problems = [];
    var html = '<tr><th>Integrates with</th>' + rel.map(function (r) { return '<th>' + esc(r.name) + '<br><span style="font-family: \'IBM Plex Mono\', monospace; font-size: 12px">' + esc(r.candidate ? r.candidate.version : 'no build') + '</span></th>'; }).join('') + '</tr>';
    targets.forEach(function (t) {
      html += '<tr><td><div style="font-weight: 500">' + esc(t.name) + '</div><div class="muted" style="font-size: 13px">' + esc(t.kind) + '</div></td>';
      rel.forEach(function (r) {
        var x = result(r, t); var l = look[x.state];
        if (x.state === 'fail') problems.push({ r: r, t: t, x: x });
        html += '<td style="color: ' + l[1] + '"><span style="font-weight: 700; margin-right: 6px">' + l[0] + '</span>' + esc(x.label) + '</td>';
      });
      html += '</tr>';
    });
    document.getElementById('grid').innerHTML = html;
    var h = document.getElementById('headline');
    if (!problems.length) {
      h.innerHTML = '<div style="font-size: 18px; font-weight: 600; color: #1F7A4D"><span class="dot" style="background: #1F7A4D"></span>Every release works with everything it connects to</div><p class="muted" style="margin: 6px 0 0">Nothing needs to ship in a particular order.</p>';
    } else {
      h.innerHTML = '<div style="font-size: 18px; font-weight: 600; color: #B42318"><span class="dot" style="background: #B42318"></span>' + problems.length + (problems.length === 1 ? ' integration is' : ' integrations are') + ' failing</div>' +
        problems.map(function (p) { return '<div class="row"><span style="font-weight: 500">' + esc(p.r.name) + ' with ' + esc(p.t.name) + '</span><span class="muted">' + esc(p.x.why) + '</span></div>'; }).join('');
    }
  }
  function load() { fetch('/api/releases').then(function (r) { return r.json(); }).then(render).catch(function () {}); }
  load();
  try { new EventSource('/api/stream').addEventListener('change', load); } catch (e) {}
})();
</script>
</div>
</body>
</html>
